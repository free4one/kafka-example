spring:
  application:
    name: kafka-example
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:kafkaexample}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:user-registration-group}
      auto-offset-reset: earliest
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

kafka:
  topic:
    user-registration: user-registration-topic
    user-registration-dlt: user-registration-dlt
  consumer:
    group-id: user-registration-group

logging:
  level:
    root: INFO
    com.example: DEBUG
